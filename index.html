<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <title>weather-app</title>
</head>

<body>
  <header class="header">
    <h1 class="title">Clima</h1>
  </header>
  <div class="searchbar">
    <label for="searchCountry" class="searchbar-label">
      <i data-lucide="search"></i>
    </label>
    <input type="text" name="searchCountry" id="searchCountry" class="searchbar-input" placeholder="Busca tu ciudad">
  </div>
  <div class="layout">
    <main class="main">
      <section class="weather-location">
        <div class="card">
          <div class="card__content">
            <h2 class="card__title" id="locationName">Nombre de la ciudad</h2>
            <div class="card__data">
              <p class="weather-temperature" id="locationTemperature">23°C</p>
              <p class="weather-status" id="locationStatus">Nublado</p>
            </div>
            <div class="card__description">
              <p class="weather-description" id="locationDescription">Ligeramente nublado</p>
              <span class="icon" id="iconCondition">Icono</span>
            </div>
          </div>
        </div>
      </section>
      <section class="weather-information">
        <div class="cards">
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Amanecer</h3>
              <i data-lucide="sunrise" class="icon"></i>
              <p class="card__value" id="sunrise">07:15 AM</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Atardecer</h3>
              <i data-lucide="sunset" class="icon"></i>
              <p class="card__value" id="sunset">19:42 PM</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Visibilidad</h3>
              <i data-lucide="eye" class="icon"></i>
              <p class="card__value" id="visibility">37 km</p>
            </div>
          </div>
        </div>
      </section>
      <section class="weather-data">
        <div class="cards">
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Sensación</h3>
              <i data-lucide="thermometer-sun" class="icon"></i>
              <p class="card__value" id="feelsLike">27°</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">T. Máxima</h3>
              <i data-lucide="Sun" class="icon"></i>
              <p class="card__value" id="tempMax">27°</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">T. Mínima</h3>
              <i data-lucide="sun-dim" class="icon"></i>
              <p class="card__value" id="tempMin">18°</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Presión</h3>
              <i data-lucide="wind-arrow-down" class="icon"></i>
              <p class="card__value" id="pressure">761 hPa</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Humedad</h3>
              <i data-lucide="droplets" class="icon"></i>
              <p class="card__value" id="humidity">18%</p>
            </div>
          </div>
          <div class="card">
            <div class="card__content">
              <h3 class="card__title">Nueves</h3>
              <i data-lucide="cloudy" class="icon"></i>
              <p class="card__value" id="clouds">18%</p>
            </div>
          </div>
        </div>
      </section>
      <section class="weather-wind">
        <div class="card">
          <div class="card__content">
            <h3 class="card__title">Viento <i data-lucide="wind" class="icon"></i></h3>
            <p class="card__text">Velocidad <span class="card__value" id="windSpeed">0 km/h</span></p>
            <p class="card__text">Dirección <span class="card__value" id="windDeg">0°</span></p>
            <p class="card__text">Rafagas <span class="card__value" id="windGust">0 km/h</span></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
